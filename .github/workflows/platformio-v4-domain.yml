name: PlatformIO V4 Domain

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ProgrammeArrosage : carte CYD historique (ESP32-2432S028).
        # ProgrammeArrosage_s3 : JC4827W543C_I, cible de production.
        env:
          - ProgrammeArrosage
          - ProgrammeArrosage_s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      # tools/patch_asyncwebserver.py patche les bibliotheques dans .pio/ au
      # premier passage : un build neuf peut echouer une fois puis reussir au
      # second (constate en local). Une seule relance ; une vraie erreur de
      # compilation echoue aussi au second passage.
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }} || pio run -e ${{ matrix.env }}
