name: OTA3 finalize branch

on:
  push:
    branches:
      - agent/ota-3.0-download-test-v591
    paths:
      - .ota3-integration-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ota-3.0-download-test-v591
          fetch-depth: 0

      - name: Integrate OTA-3.0
        run: python .github/ota3_integrate.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MaintenanceBoot.cpp src/WebManager.h
          git diff --cached --check
          git commit -m "feat(ota): integrate download verification flow"
          git push origin HEAD:agent/ota-3.0-download-test-v591
