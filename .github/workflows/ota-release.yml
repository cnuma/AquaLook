name: AquaLook OTA Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v5.9.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ota-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          expected="v${version}"
          actual="${{ steps.release.outputs.tag }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Tag $actual does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      # P1.4 : release S3 seule, binaire de PRODUCTION (routes de
      # developpement absentes, D020). Ni carte historique ni pages Web : les
      # pages passent par leur propre catalogue signe (AlwaysData).
      - name: Build S3 production firmware
        run: pio run -e ProgrammeArrosage_s3

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp .pio/build/ProgrammeArrosage_s3/firmware.bin "release/AquaLook-s3-${version}.bin"
          python tools/generate_ota_manifest.py \
            --version "$version" \
            --tag "${{ steps.release.outputs.tag }}" \
            --s3 "release/AquaLook-s3-${version}.bin" \
            --output release/aqualook-manifest.json
          (cd release && sha256sum * | tee SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaLook-OTA-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      # Release en BROUILLON : invisible des modules (releases/latest ignore
      # les brouillons). La cle de signature reste hors ligne (D018) : le
      # proprietaire verifie, signe et publie depuis son poste avec
      # tools/release_firmware.py signer X.Y.Z. Une release deja publiee
      # n'est jamais modifiee ici : ses binaires correspondent a une
      # signature, les remplacer la rendrait fausse.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "Release $tag already published: refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --draft \
              --title "AquaLook ${version}" \
              --generate-notes
          fi
