name: AquaLook OTA Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v5.9.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ota-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          expected="v${version}"
          actual="${{ steps.release.outputs.tag }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Tag $actual does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Legacy firmware
        run: pio run -e ProgrammeArrosage

      - name: Build V4 firmware
        run: pio run -e ProgrammeArrosage_v4

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp .pio/build/ProgrammeArrosage/firmware.bin "release/AquaLook-legacy-${version}.bin"
          cp .pio/build/ProgrammeArrosage_v4/firmware.bin "release/AquaLook-v4-${version}.bin"
          python tools/generate_ota_manifest.py \
            --version "$version" \
            --tag "${{ steps.release.outputs.tag }}" \
            --legacy "release/AquaLook-legacy-${version}.bin" \
            --v4 "release/AquaLook-v4-${version}.bin" \
            --output release/aqualook-manifest.json
          sha256sum release/* | tee release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaLook-OTA-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "AquaLook ${version}" \
              --generate-notes \
              --latest
          fi
