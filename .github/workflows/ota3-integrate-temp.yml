name: OTA3 temporary integration

on:
  push:
    branches:
      - agent/ota-3.0-download-test-v591

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ota-3.0-download-test-v591
      - name: Integrate MaintenanceBoot and WebManager
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          boot_path = Path('src/MaintenanceBoot.cpp')
          boot = boot_path.read_text(encoding='utf-8')
          boot = replace_once(
              boot,
              '#include "MaintenanceResult.h"\n#include "OtaBuildIdentity.h"',
              '#include "MaintenanceResult.h"\n#include "OtaDownloadTest.h"\n#include "OtaBuildIdentity.h"',
              'MaintenanceBoot include'
          )
          boot = replace_once(
              boot,
              'if (request != MaintenanceRequest::PROBE_GITHUB &&\n        request != MaintenanceRequest::CHECK_VERSION) {',
              'if (request != MaintenanceRequest::PROBE_GITHUB &&\n        request != MaintenanceRequest::CHECK_VERSION &&\n        request != MaintenanceRequest::DOWNLOAD_UPDATE_TEST) {',
              'MaintenanceBoot request allowlist'
          )
          boot = replace_once(
              boot,
              '    } else {\n        const String manifestUrl = String("https://") + OtaBuildIdentity::MANIFEST_HOST +',
              '    } else if (request == MaintenanceRequest::CHECK_VERSION) {\n        const String manifestUrl = String("https://") + OtaBuildIdentity::MANIFEST_HOST +',
              'MaintenanceBoot CHECK_VERSION branch'
          )
          marker = '''        EventLog::log(result.success ? LOG_INFO : LOG_ERROR,
                      "Maintenance: CHECK_VERSION success=%s installed=%s available=%s update=%s detail=%s otaWrite=no",
                      result.success ? "yes" : "no", result.installedVersion,
                      result.availableVersion[0] ? result.availableVersion : "n/a",
                      result.updateAvailable ? "yes" : "no", result.detail);
    }
'''
          replacement = marker[:-6] + '''    } else {
        const MaintenanceResult validatedManifest = MaintenanceResultStore::load();
        const MaintenanceResult result = OtaDownloadTest::run(validatedManifest);
        success = result.success;
        if (!MaintenanceResultStore::save(result)) {
            EventLog::log(LOG_ERROR,
                          "Maintenance: echec sauvegarde resultat DOWNLOAD_UPDATE_TEST");
        }
        EventLog::log(
            result.success ? LOG_INFO : LOG_ERROR,
            "Maintenance: DOWNLOAD_UPDATE_TEST success=%s bytes=%lu expected=%lu detail=%s otaWrite=no",
            result.success ? "yes" : "no",
            static_cast<unsigned long>(result.downloadedSize),
            static_cast<unsigned long>(result.firmwareSize),
            result.detail
        );
    }
'''
          boot = replace_once(boot, marker, replacement, 'MaintenanceBoot download branch')
          boot_path.write_text(boot, encoding='utf-8')

          web_path = Path('src/WebManager.h')
          web = web_path.read_text(encoding='utf-8')
          web = replace_once(
              web,
              '                    doc["firmwareSize"] = result.firmwareSize;\n',
              '                    doc["firmwareSize"] = result.firmwareSize;\n                    doc["downloadedSize"] = result.downloadedSize;\n                    doc["downloadDurationMs"] = result.downloadDurationMs;\n',
              'WebManager JSON sizes'
          )
          web = replace_once(
              web,
              '                    doc["sha256"] = result.sha256;\n',
              '                    doc["sha256"] = result.sha256;\n                    doc["calculatedSha256"] = result.calculatedSha256;\n',
              'WebManager JSON sha'
          )
          web = replace_once(
              web,
              '<button id="check" onclick="startMaintenance(\'check\')">Verifier la version disponible</button><button id="probe" class="secondary"',
              '<button id="check" onclick="startMaintenance(\'check\')">Verifier la version disponible</button><button id="download" onclick="startMaintenance(\'download\')">Tester le telechargement et le SHA-256</button><button id="probe" class="secondary"',
              'WebManager download button'
          )
          web = replace_once(
              web,
              "if(j.command==='check_version'){rows.push(",
              "if(j.command==='check_version'||j.command==='download_update_test'){rows.push(",
              'WebManager common result rows'
          )
          web = replace_once(
              web,
              "}if(j.detail)rows.push(['Detail',j.detail]);",
              "}if(j.command==='download_update_test'){rows.push(['Octets telecharges',(j.downloadedSize||0)+' octets'],['Duree telechargement',(j.downloadDurationMs||0)+' ms'],['SHA-256 calcule',j.calculatedSha256||'-']);}if(j.detail)rows.push(['Detail',j.detail]);",
              'WebManager download result rows'
          )
          old_start = "async function startMaintenance(kind){const check=document.getElementById('check'),probe=document.getElementById('probe'),out=document.getElementById('action');const isCheck=kind==='check';const uri=isCheck?'/api/maintenance/check-version':'/api/maintenance/probe-github';const question=isCheck?'AquaLook va redemarrer pour verifier la version disponible. Continuer ?':'AquaLook va redemarrer pour tester GitHub. Continuer ?';if(!confirm(question))return;check.disabled=true;probe.disabled=true;out.textContent='Preparation du redemarrage...';try{const x=await fetch(uri,{method:'POST'});const j=await x.json().catch(()=>({}));if(!x.ok){out.textContent=j.error==='watering-active'?'Operation refusee : arrosage en cours.':'Erreur : '+(j.error||x.status);check.disabled=false;probe.disabled=false;return}out.textContent='Demande acceptee. Redemarrage en cours...';setTimeout(()=>{out.textContent='Operation en cours. Rechargez cette page apres le retour d AquaLook.'},1500)}catch(_){out.textContent='Connexion interrompue : le module redemarre probablement.'}}"
          new_start = "async function startMaintenance(kind){const check=document.getElementById('check'),download=document.getElementById('download'),probe=document.getElementById('probe'),out=document.getElementById('action');const uri=kind==='check'?'/api/maintenance/check-version':kind==='download'?'/api/maintenance/download-update-test':'/api/maintenance/probe-github';const question=kind==='check'?'AquaLook va redemarrer pour verifier la version disponible. Continuer ?':kind==='download'?'Le firmware complet sera telecharge et verifie sans etre installe. Continuer ?':'AquaLook va redemarrer pour tester GitHub. Continuer ?';if(!confirm(question))return;check.disabled=true;download.disabled=true;probe.disabled=true;out.textContent='Preparation du redemarrage...';try{const x=await fetch(uri,{method:'POST'});const j=await x.json().catch(()=>({}));if(!x.ok){out.textContent=j.error==='watering-active'?'Operation refusee : arrosage en cours.':'Erreur : '+(j.error||x.status);check.disabled=false;download.disabled=false;probe.disabled=false;return}out.textContent='Demande acceptee. Redemarrage en cours...';setTimeout(()=>{out.textContent='Operation en cours. Rechargez cette page apres le retour d AquaLook.'},1500)}catch(_){out.textContent='Connexion interrompue : le module redemarre probablement.'}}"
          web = replace_once(web, old_start, new_start, 'WebManager startMaintenance')
          route_marker = '''        _server.on("/logs", HTTP_GET,
'''
          route = '''        _server.on("/api/maintenance/download-update-test", HTTP_POST,
            [this](AsyncWebServerRequest* req) {
                if (!_config || !_relais) {
                    req->send(503, "application/json", "{\\"ok\\":false,\\"error\\":\\"runtime-not-ready\\"}");
                    return;
                }
                for (uint8_t zone = 0U; zone < _config->nbZones(); ++zone) {
                    if (_relais->getState(zone)) {
                        EventLog::log(LOG_WARN,
                                      "Maintenance Web: test telechargement refuse, zone %u active",
                                      static_cast<unsigned>(zone + 1U));
                        req->send(409, "application/json", "{\\"ok\\":false,\\"error\\":\\"watering-active\\"}");
                        return;
                    }
                }
                const MaintenanceResult manifest = MaintenanceResultStore::load();
                if (!manifest.valid || !manifest.success || !manifest.updateAvailable) {
                    req->send(409, "application/json", "{\\"ok\\":false,\\"error\\":\\"version-check-required\\"}");
                    return;
                }
                if (!MaintenanceRequestStore::save(MaintenanceRequest::DOWNLOAD_UPDATE_TEST)) {
                    EventLog::log(LOG_ERROR,
                                  "Maintenance Web: echec enregistrement DOWNLOAD_UPDATE_TEST NVS");
                    req->send(500, "application/json", "{\\"ok\\":false,\\"error\\":\\"nvs-write-failed\\"}");
                    return;
                }
                EventLog::log(LOG_WARN,
                              "Maintenance Web: test telechargement demande, redemarrage programme");
                _restartPending = true;
                _restartAtMs = millis() + 750U;
                req->send(202, "application/json", "{\\"ok\\":true,\\"restart\\":true,\\"command\\":\\"download_update_test\\"}");
            }
        );

'''
          web = replace_once(web, route_marker, route + route_marker, 'WebManager download route')
          web_path.write_text(web, encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'DOWNLOAD_UPDATE_TEST' src/MaintenanceBoot.cpp
          grep -q 'download-update-test' src/WebManager.h
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/MaintenanceBoot.cpp src/WebManager.h
          git commit -m "feat(ota): integrate download verification command"
          git push origin HEAD:agent/ota-3.0-download-test-v591
