<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="DejaVu Sans Mono, Consolas, monospace">
  <title>Illustration de l'écran d'accueil du module (4 zones)</title>
  <!-- Boîtier -->
  <rect x="0" y="0" width="560" height="360" rx="22" fill="#2b2f2c"/>
  <rect x="40" y="34" width="480" height="272" fill="#101818"/>
  <!-- Bandeau -->
  <rect x="40" y="34" width="480" height="28" fill="#283028"/>
  <g fill="#c0d0c8"><rect x="50" y="42" width="16" height="2.5"/><rect x="50" y="47" width="16" height="2.5"/><rect x="50" y="52" width="16" height="2.5"/></g>
  <text x="76" y="53" font-size="12" fill="#f8fcf8">10:42</text>
  <text x="130" y="53" font-size="11" fill="#789c80">Toulouse  16°  pluie 2.4mm</text>
  <text x="440" y="53" font-size="11" fill="#6633cc" font-weight="bold">MAJ DISPO</text>
  <!-- Planning -->
  <g font-size="9" fill="#789c80"><text x="54" y="78">ZONE</text><text x="150" y="78">6h</text><text x="205" y="78">9h</text><text x="260" y="78">12h</text><text x="315" y="78">15h</text><text x="370" y="78">18h</text><text x="425" y="78">21h</text></g>
  <g font-size="10">
    <rect x="44" y="84" width="472" height="22" fill="#10283c"/>
    <rect x="44" y="84" width="4" height="22" fill="#00ff00"/>
    <text x="54" y="99" fill="#f8fcf8">Potager</text>
    <rect x="160" y="90" width="22" height="10" fill="#00ff00"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="410" y="90" width="16" height="10" fill="#00ff00" opacity="0.6"/>
    <rect x="44" y="108" width="472" height="22" fill="#182420"/>
    <rect x="44" y="108" width="4" height="22" fill="#0090ff"/>
    <text x="54" y="123" fill="#f8fcf8">Pelouse</text>
    <g fill="#5a6a60"><path d="M160 112 l10 7 l-10 7 z M176 112 l10 7 l-10 7 z M192 112 l10 7 l-10 7 z"/></g>
    <rect x="44" y="132" width="472" height="22" fill="#182420"/>
    <rect x="44" y="132" width="4" height="22" fill="#ffa400"/>
    <text x="54" y="147" fill="#f8fcf8">Haies</text>
    <rect x="148" y="138" width="20" height="10" fill="#ffa400" opacity="0.8"/>
    <g stroke="#ffa400" stroke-width="1.5" opacity="0.7"><path d="M148 148 l8 -10 M156 148 l8 -10 M164 148 l4 -5"/></g>
    <rect x="44" y="156" width="472" height="22" fill="#182420"/>
    <rect x="44" y="156" width="4" height="22" fill="#780078"/>
    <text x="54" y="171" fill="#789c80">Pots terr.</text>
    <text x="160" y="171" fill="#789c80" font-size="9">Aucune sortie affectee</text>
  </g>
  <!-- Boutons de zone -->
  <g font-size="10">
    <rect x="44" y="186" width="114" height="114" rx="6" fill="#10283c" stroke="#00ff00"/>
    <text x="52" y="204" fill="#f8fcf8" font-weight="bold">Potager</text>
    <text x="52" y="224" fill="#bdbdbd" font-size="9">Temps restant</text>
    <text x="52" y="248" fill="#ffff00" font-size="18">10:40</text>
    <text x="52" y="290" fill="#c0d0c8" font-size="8">Appuyer pour arreter</text>
    <rect x="162" y="186" width="114" height="114" rx="6" fill="#182420" stroke="#384c40"/>
    <text x="170" y="204" fill="#f8fcf8" font-weight="bold">Pelouse</text>
    <text x="170" y="224" fill="#789c80" font-size="9">Prochain arrosage</text>
    <text x="170" y="248" fill="#f8fcf8" font-size="14">jeu. 05:30</text>
    <text x="170" y="290" fill="#c0d0c8" font-size="8">Appuyer pour arroser</text>
    <rect x="280" y="186" width="114" height="114" rx="6" fill="#182420" stroke="#384c40"/>
    <text x="288" y="204" fill="#f8fcf8" font-weight="bold">Haies</text>
    <text x="288" y="224" fill="#ffa400" font-size="9">Pluie 2.4mm</text>
    <text x="288" y="248" fill="#f8fcf8" font-size="14">jeu. 06:15</text>
    <text x="288" y="290" fill="#c0d0c8" font-size="8">Appuyer pour arroser</text>
    <rect x="398" y="186" width="114" height="114" rx="6" fill="#182420" stroke="#384c40"/>
    <text x="406" y="204" fill="#789c80" font-weight="bold">Pots terr.</text>
    <text x="406" y="248" fill="#789c80" font-size="10">Sans sortie</text>
  </g>
  <!-- Légende -->
  <text x="280" y="330" font-size="12" fill="#c0d0c8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Illustration : disposition de l'écran d'accueil, pas une photo</text>
  <text x="280" y="348" font-size="11" fill="#9aa59e" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">≡ menu (ADMIN) · barre clignotante = créneau en cours · hachures = pluie · ››› = intervalle</text>
</svg>
