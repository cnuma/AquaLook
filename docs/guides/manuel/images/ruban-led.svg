<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Le ruban lumineux : une LED d'état, puis une LED par zone</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1b5e20">Le ruban lumineux</text>
  <rect x="20" y="48" width="600" height="56" rx="10" fill="#2b2f2c"/>
  <g font-size="11" fill="#e8ece9" text-anchor="middle">
    <circle cx="70" cy="76" r="16" fill="#0090ff"/><text x="70" y="124" fill="#333">État</text>
    <circle cx="190" cy="76" r="16" fill="#0090ff"/><text x="190" y="124" fill="#333">Zone 1</text>
    <circle cx="310" cy="76" r="16" fill="#3a3f3c"/><text x="310" y="124" fill="#333">Zone 2</text>
    <circle cx="430" cy="76" r="16" fill="#ff8c00"/><text x="430" y="124" fill="#333">Zone 3</text>
    <circle cx="550" cy="76" r="16" fill="#3a3f3c"/><text x="550" y="124" fill="#333">Zone 4</text>
  </g>
  <text x="20" y="150" font-size="12" fill="#555">Exemple : la zone 1 arrose (état et zone 1 en bleu), la zone 3 est annulée par la pluie (orange).</text>
  <g font-size="12" fill="#222">
    <text x="20" y="182" font-weight="bold">LED d'état</text>
    <circle cx="30" cy="200" r="7" fill="#0090ff"/><text x="44" y="204">bleu clignotant : arrosage en cours</text>
    <circle cx="30" cy="222" r="7" fill="#ff6400"/><text x="44" y="226">orange rapide : recherche du Wi-Fi</text>
    <circle cx="30" cy="244" r="7" fill="#6633cc"/><text x="44" y="248">violet lent : mise à jour disponible</text>
    <circle cx="30" cy="266" r="7" fill="#6633cc" stroke="#222" stroke-width="2"/><text x="44" y="270">violet fixe : mise à jour, ne pas débrancher</text>
    <circle cx="30" cy="288" r="7" fill="#e00000"/><text x="44" y="292">rouge clignotant : défaut à examiner</text>
    <text x="340" y="182" font-weight="bold">LED de zone</text>
    <circle cx="350" cy="200" r="7" fill="#0090ff"/><text x="364" y="204">bleu : la zone arrose</text>
    <circle cx="350" cy="222" r="7" fill="#ff8c00"/><text x="364" y="226">orange : prévu, annulé par la pluie</text>
    <circle cx="350" cy="244" r="7" fill="#3a3f3c"/><text x="364" y="248">éteinte : rien de prévu</text>
    <circle cx="350" cy="266" r="7" fill="#ffffff" stroke="#999"/><text x="364" y="270">blanc clignotant : identification</text>
    <circle cx="350" cy="288" r="7" fill="#6633cc"/><text x="364" y="292">violet fixe : mise à jour en cours</text>
  </g>
  <text x="20" y="320" font-size="11" fill="#777">Illustration. Couleurs relevées dans le code 5.20.0 (ScreenManager::updateLed, renderZones).</text>
</svg>
