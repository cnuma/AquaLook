<!doctype html><meta charset="utf-8"><body><pre id="out"></pre>
<!-- Banc de l'editeur graphique des scripts (data/script-schema.js) :
     generation -> compilation par script-lang.js, aller-retour texte ->
     schema -> texte (texte et bytecode identiques), refus des tournures non
     dessinables. Sans serveur ni module :
       msedge --headless --allow-file-access-from-files --dump-dom tools/script_schema_test.html
     La premiere ligne de la sortie vaut « TOUT OK » ou « ECHECS: n ». -->
<script src="../data/script-lang.js"></script>
<script src="../data/script-schema.js"></script>
<script>
const out=[];let fails=0;
const ok=(c,m)=>{out.push((c?'OK   ':'FAIL ')+m); if(!c) fails++;};
const names={zone:i=>'Zone'+i,input:i=>'E'+i,phrase:c=>'P'+c};
const S=AquaSchema, mk=S.make;
function rt(body,label){
  const g1=S.generate(body,names); let c1;
  try{c1=AquaScript.compile(g1.text);}catch(e){ok(false,label+' compile: '+e.message+' L'+e.line+'\n'+g1.text);return;}
  ok(c1.length<=400,label+' taille '+c1.length+' octets');
  let b2; try{b2=S.parse(g1.text);}catch(e){ok(false,label+' parse: '+e.message+' L'+e.line+'\n'+g1.text);return;}
  const g2=S.generate(b2,names);
  ok(g2.text===g1.text,label+' aller-retour identique'+(g2.text===g1.text?'':'\n'+g1.text+'---\n'+g2.text));
  ok(JSON.stringify(AquaScript.compile(g2.text).slice())===JSON.stringify(c1.slice()),label+' bytecode identique');
}
// 1. arbres construits
const si=mk('si',{}); si.cond={terms:[{k:'entree',id:1,v:1}],ops:[]};
si.oui=[mk('suspendre'),mk('notifier')]; si.non=[mk('reprendre'),mk('message')];
rt([si],'pluie');
const rep=mk('repeter'); rep.body=[mk('arroser'),mk('attendre')]; rt([rep,mk('notifier')],'fractionne');
const si2=mk('si'); si2.non=[mk('arroser')]; rt([si2],'oui vide');
const tq=mk('tantque'); tq.cond={terms:[{k:'zoneactive',id:2,v:1},{k:'entree',id:3,v:0}],ops:['ou']}; tq.body=[mk('attendre')];
const r1=mk('repeter'),r2=mk('repeter'); r2.body=[mk('arroser'),mk('arreter')]; r1.body=[r2,tq]; rt([r1],'imbrique');
rt([],'vide');
// 2. textes ecrits a la main
const hand={
 'nu':'si entree(1) alors\n arreter zone 2\nfinsi',
 'diff':'si entree(1) != 0 et non zoneactive(3) alors demarrer zone 1 pendant 90 finsi',
 'paren':'si (entree(2) == 0) ou (zoneactive(1)) alors message 5 sinon notifier 6 finsi # c',
 'pour a':'pour b de 1 a 4 faire attendre 10 finpour',
 'MAJ':'SI ENTREE(1) == 1 ALORS ARRETER ZONE 1 FINSI'
};
for(const [k,t] of Object.entries(hand)){ try{ const b=S.parse(t); const g=S.generate(b,names); AquaScript.compile(g.text); AquaScript.compile(t); ok(true,'main '+k); rt(b,'main '+k);}catch(e){ok(false,'main '+k+': '+e.message+' L'+e.line);} }
// 2b. attente de fin d'arrosage (6 oct. 2026 : « Repeter 3 fois » ouvrait la zone 3 fois en parallele)
{
  const a=mk('arroser'); ok(a.attente===true,'Arroser attend la fin par defaut');
  const g=S.generate([a],names).text;
  ok(/tantque reste\(1\) > 0 faire/.test(g),'attente ecrite avec reste()');
  const r=mk('repeter'); const z=mk('arroser'); z.zone=2; z.sec=5; r.body=[mk('arreter'),z]; rt([r],'repeter + arroser avec attente');
  const b=S.parse('demarrer zone 2 pendant 5\nattendre 5');
  ok(b.length===2 && b[0].attente===false,'ancien script sans attente : 2 blocs, attente=false');
  rt(b,'ancien script sans attente');
  try{ S.parse('demarrer zone 1 pendant 5\ntantque reste(2) > 0 faire attendre 1 fintantque'); ok(false,'attente sur une autre zone acceptee a tort'); }
  catch(e){ ok(e instanceof S.Unsupported,'attente sur une autre zone refusee : '+e.message); }
}
// 2c. lancer un autre script (6 oct. 2026)
{
  const l=mk('lancer',{scriptNo:3}); ok(l.script===3,'Lancer un script : emplacement par defaut');
  const g=S.generate([l],names).text;
  ok(/^lancer script 3/.test(g),'texte : lancer script 3');
  const c=AquaScript.compile(g); ok(c[0]===1 && c[5]===80 && c[6]===6 && c[7]===3 && c[8]===0,'bytecode : PUSH 0, ACTION SCRIPT_RUN cible 3');
  rt([l, mk('arroser')],'lancer + arroser');
  try{ AquaScript.compile('lancer script 7'); ok(false,'lancer script 7 accepte a tort'); }
  catch(e){ ok(e.line===1,'lancer script 7 refuse a la compilation : '+e.message); }
}
// 2d. bloc « En parallele » (6 oct. 2026)
{
  const p=mk('parallele'); const z1=mk('arroser'); z1.zone=1; z1.sec=60; const z2=mk('arroser'); z2.zone=2; z2.sec=60;
  p.a=[z1]; p.b=[z2];
  const g=S.generate([p,mk('notifier')],names).text;
  ok(/^parallele/.test(g) && /\navec/.test(g) && /\nfinparallele/.test(g),'texte : parallele / avec / finparallele');
  const c=AquaScript.compile(g);
  // FORK Lb ; [1] ; JOIN ; JMP fin ; Lb: [2] ; ENDBRANCH ; fin:
  const lb=c[1]|(c[2]<<8);
  ok(c[0]===84,'bytecode : commence par FORK');
  ok(c[lb-4]===85 && c[lb-3]===48,'bytecode : JOIN puis JMP juste avant la branche 2');
  const fin=c[lb-2]|(c[lb-1]<<8);
  ok(c[fin-1]===86,'bytecode : ENDBRANCH juste avant la fin du bloc');
  rt([p,mk('notifier')],'parallele + suite');
  const vide=mk('parallele'); rt([vide],'parallele vide');
  try{ AquaScript.compile('parallele\nparallele\navec\nfinparallele\navec\nfinparallele'); ok(false,'parallele imbrique accepte a tort'); }
  catch(e){ ok(e.line===2,'parallele imbrique refuse a la compilation (L'+e.line+')'); }
  try{ S.parse('parallele\nparallele\navec\nfinparallele\navec\nfinparallele'); ok(false,'parallele imbrique relu a tort'); }
  catch(e){ ok(e instanceof S.Unsupported,'parallele imbrique refuse a la relecture'); }
}
// 2f. « En parallele » en Et / en Ou (8 oct. 2026)
{
  const p=mk('parallele'); ok(p.mode==='et','nouveau bloc : en Et par defaut');
  const z1=mk('arroser'); z1.zone=1; z1.sec=60; const z2=mk('arroser'); z2.zone=2; z2.sec=60;
  p.a=[z1]; p.b=[z2];
  const gEt=S.generate([p],names).text;
  // schema anterieur (sans champ mode) : meme texte, meme bytecode qu'en Et
  const old=JSON.parse(JSON.stringify(p)); delete old.mode;
  ok(S.generate([old],names).text===gEt,'schema sans champ mode : texte identique a Et');
  ok(JSON.stringify(AquaScript.compile('parallele et\navec\nfinparallele').slice())===JSON.stringify(AquaScript.compile('parallele\navec\nfinparallele').slice()),'« parallele et » = « parallele »');
  p.mode='ou';
  const g=S.generate([p,mk('notifier')],names).text;
  ok(/^parallele ou/.test(g),'texte : parallele ou');
  const c=AquaScript.compile(g);
  // FORK L1 ; FORK L2 ; JOINANY ; JMP fin ; L1: [1] ENDBRANCH ; L2: [2] ENDBRANCH ; fin: ... JOIN ; HALT
  const l1=c[1]|(c[2]<<8), l2=c[4]|(c[5]<<8), fin=c[8]|(c[9]<<8);
  ok(c[0]===84 && c[3]===84 && c[6]===87 && c[7]===48,'ou : FORK, FORK, JOINANY, JMP');
  ok(l1===10 && c[l2-1]===86 && c[fin-1]===86,'ou : branches closes par ENDBRANCH');
  ok(c[c.length-2]===85 && c[c.length-1]===0,'ou : JOIN juste avant le HALT final');
  rt([p,mk('notifier')],'parallele ou + suite');
  ok(S.parse(g)[0].mode==='ou','relecture : mode ou');
  const cEt=AquaScript.compile(gEt); ok(cEt[cEt.length-1]===0 && cEt[cEt.length-2]===86,'Et seul : pas de JOIN final ajoute');
  try{ AquaScript.compile('parallele ou\nparallele\navec\nfinparallele\navec\nfinparallele'); ok(false,'ou imbrique accepte a tort'); }
  catch(e){ ok(e.line===2,'ou imbrique refuse a la compilation'); }
}
// 2g. Variables globales g1..g16 (8 oct. 2026)
{
  const names2=Object.assign({},names,{globale:i=>'V'+i});
  const v1=mk('variable'); ok(v1.g===1 && v1.op==='=' && v1.v===0,'nouveau bloc Variable : g1 = 0');
  const vs=[['=',7],['=',-3],['+',2],['-',5]].map(([op,v],k)=>{const n=mk('variable'); n.g=k+3; n.op=op; n.v=v; return n;});
  const g=S.generate(vs,names2).text;
  ok(/^g3 = 7   # V3/.test(g) && /\ng4 = -3/.test(g) && /\ng5 = g5 \+ 2/.test(g) && /\ng6 = g6 - 5/.test(g),'texte : = valeur, = negatif, + et -\n'+g);
  rt(vs,'variables : = + -');
  const c=AquaScript.compile('g16 = g16 + 1');
  ok(c[0]===5 && c[1]===15 && c[c.length-3]===6 && c[c.length-2]===15,'bytecode : GLOAD 15 ... GSTORE 15');
  try{ AquaScript.compile('g17 = 1'); ok(false,'g17 accepte a tort'); } catch(e){ ok(e.line===1,'g17 refuse a la compilation'); }
  ok(AquaScript.compile('g = 1')[5]===3,'« g » seul reste la variable locale (STORE)');
  ['==','!=','<','>','<=','>='].forEach((cmp)=>{
    const s=mk('si'); s.cond={terms:[{k:'globale',id:2,cmp:cmp,v:10}],ops:[]};
    const tx=S.generate([s],names2).text;
    ok(tx.indexOf('si g2 '+cmp+' 10 alors')===0,'condition '+cmp+' : texte');
    rt([s],'condition variable '+cmp);
  });
  const neg=S.parse('si non g2 > 5 alors\nfinsi\n'); ok(neg[0].cond.terms[0].cmp==='<=','« non g2 > 5 » relu en g2 <= 5');
  const mixte=S.parse('si entree(1) == 1 et g4 >= -2 alors\nfinsi\n'); ok(mixte[0].cond.terms[1].k==='globale' && mixte[0].cond.terms[1].v===-2,'condition mixte entree + variable, valeur negative');
  try{ S.parse('si g2 alors\nfinsi\n'); ok(false,'g2 sans comparaison relu a tort'); } catch(e){ ok(e instanceof S.Unsupported,'g2 sans comparaison : mode texte'); }
  try{ S.parse('g2 = g3 + 1\n'); ok(false,'g2 = g3 + 1 relu a tort'); } catch(e){ ok(e instanceof S.Unsupported,'g2 = g3 + 1 : mode texte'); }
  const tq=mk('tantque'); tq.cond={terms:[{k:'globale',id:1,cmp:'<',v:3}],ops:[]}; const inc=mk('variable'); inc.op='+'; inc.v=1; tq.body=[inc,mk('attendre')];
  rt([tq],'tant que g1 < 3 : g1 + 1');
}
// 2h. « Noter au journal » avec la valeur d'une variable (8 oct. 2026)
{
  const names2=Object.assign({},names,{globale:i=>'V'+i});
  const m=mk('message'); m.code=900; m.gvar=4;
  const g=S.generate([m],names2).text;
  ok(g.indexOf('message 900 avec g4   # P900, V4')===0,'texte : message 900 avec g4\n'+g);
  const c=AquaScript.compile(g);
  ok(c[0]===88 && (c[1]|(c[2]<<8))===900 && c[3]===3,'bytecode : NOTIFY_VAR 900, g4 -> 3');
  rt([m],'message avec variable');
  ok(S.parse(g)[0].gvar===4,'relecture : gvar=4');
  const m2=mk('message'); ok(!m2.gvar && AquaScript.compile(S.generate([m2],names2).text)[0]===81,'message sans variable : NOTIFY inchange');
  try{ AquaScript.compile('message 900 avec a'); ok(false,'avec a accepte a tort'); } catch(e){ ok(e.line===1,'« avec a » refuse a la compilation'); }
  try{ S.parse('notifier 900 avec g1\n'); ok(false,'notifier avec relu a tort'); } catch(e){ ok(e instanceof S.Unsupported,'notifier ... avec : non dessinable'); }
}
// 2e. « et » / « ou » entre chaque condition, « et » avant « ou » (7 oct. 2026)
{
  const T=(id)=>({k:'entree',id:id,v:1});
  // un operateur unique s'ecrit comme avant : pas de parentheses
  const s1=mk('si'); s1.cond={terms:[T(1),T(2),T(3)],ops:['et','et']};
  ok(/^si entree\(1\) == 1 et entree\(2\) == 1 et entree\(3\) == 1 alors/.test(S.generate([s1],names).text),'operateur unique : texte inchange, sans parentheses');
  // melange : groupes « et » entre parentheses, bytecode identique au texte sans parentheses
  const s2=mk('si'); s2.cond={terms:[T(1),T(2),T(3),T(4)],ops:['et','ou','et']};
  const g2=S.generate([s2],names).text;
  ok(g2.indexOf('si (entree(1) == 1 et entree(2) == 1) ou (entree(3) == 1 et entree(4) == 1) alors')===0,'melange : groupes entre parentheses\n'+g2);
  const nu='si entree(1) == 1 et entree(2) == 1 ou entree(3) == 1 et entree(4) == 1 alors\nfinsi\n';
  ok(JSON.stringify(AquaScript.compile(g2).slice())===JSON.stringify(AquaScript.compile(nu).slice()),'melange : meme bytecode avec ou sans parentheses');
  rt([s2],'melange et/ou/et');
  const s3=mk('tantque'); s3.cond={terms:[T(1),T(2),{k:'zoneactive',id:2,v:0}],ops:['ou','et']}; s3.body=[mk('attendre')];
  ok(/^tantque entree\(1\) == 1 ou \(entree\(2\) == 1 et zoneactive\(2\) == 0\) faire/.test(S.generate([s3],names).text),'Tant que : ou puis groupe et');
  rt([s3],'tant que ou/et');
  // relecture de textes ecrits a la main, avec ou sans parentheses
  const lus={
    'si entree(1) et entree(2) ou entree(3) alors arreter zone 1 finsi':['et','ou'],
    'si entree(1) ou entree(2) et non entree(3) alors arreter zone 1 finsi':['ou','et'],
    'si (entree(1) et entree(2)) ou entree(3) alors arreter zone 1 finsi':['et','ou'],
    'si ((entree(1))) ou (entree(2) ou entree(3)) alors arreter zone 1 finsi':['ou','ou']
  };
  for(const [t,ops] of Object.entries(lus)){
    try{ const b=S.parse(t); ok(JSON.stringify(b[0].cond.ops)===JSON.stringify(ops),'relu '+JSON.stringify(b[0].cond.ops)+' : '+t); rt(b,'relu : '+t); }
    catch(e){ ok(false,'relecture '+t+' : '+e.message); }
  }
  // table de verite : condEval (schema, essai a blanc) == priorite du langage.
  // JavaScript a la meme priorite (&& avant ||) : on lui fait evaluer le
  // texte genere, mots remplaces, pour toutes les combinaisons d'entrees.
  const modeles=[['et','ou','et'],['ou','et','ou'],['ou','et','et'],['et','et','ou'],['ou','ou','et']];
  let diffs=0, cas=0;
  modeles.forEach((ops)=>{
    const c={terms:[T(1),T(2),{k:'entree',id:3,v:0},T(4)],ops:ops};
    const js=S.condText(c,(t)=>'(E['+t.id+']==='+t.v+')',' && ',' || ');
    for(let m=0;m<16;m++){
      const E=[0,m&1,(m>>1)&1,(m>>2)&1,(m>>3)&1]; cas++;
      const attendu=Function('E','return '+js)(E);
      if(S.condEval(c,(t)=>E[t.id]===t.v)!==attendu) diffs++;
    }
  });
  ok(diffs===0,'table de verite : '+cas+' cas, '+diffs+' ecart(s) entre schema et priorite du langage');
}
// 3. refus attendus
const ko={
 'variable':'a = 3\nattendre a',
 'arith':'attendre 60 * 2',
 'reste':'si reste(1) > 10 alors arreter zone 1 finsi',
 'ou dans et':'si (entree(1) ou entree(2)) et entree(3) alors arreter zone 1 finsi',
 'non groupe':'si non (entree(1) et entree(2)) alors arreter zone 1 finsi',
 'pour2':'pour a de 2 à 4 faire attendre 1 finpour',
 'reuse':'pour a de 1 à 2 faire\npour a de 1 à 3 faire attendre 1 finpour\nfinpour',
 'cmp2':'si entree(1) == 2 alors arreter zone 1 finsi',
 'manquant':'si entree(1) alors\narreter zone 1',
 'duree var':'demarrer zone 1 pendant b'
};
for(const [k,t] of Object.entries(ko)){ try{ S.parse(t); ok(false,'refus '+k+' : accepte a tort'); }catch(e){ ok(e instanceof S.Unsupported && e.line>0,'refus '+k+' -> L'+e.line+' '+e.message); } }
ok(S.duree(600)==='10 min'&&S.duree(90)==='90 s'&&S.duree(5400)==='1 h 30 min'&&S.duree(7200)==='2 h','durees '+[600,90,5400,7200].map(S.duree).join(' | '));
out.unshift(fails?('ECHECS: '+fails):'TOUT OK');
document.getElementById('out').textContent=out.join('\n');
</script>
