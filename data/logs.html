<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AquaLook - Journal</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#ddd;font-family:sans-serif}header{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;background:#151515;position:sticky;top:0;z-index:2}button{border:1px solid #ef5350;border-radius:6px;padding:.65rem 1rem;background:#b71c1c;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#263238;border-color:#607d8b}button.good{background:#1b5e20;border-color:#43a047}button.danger-action{background:#6d1b1b;border-color:#ef5350}button:disabled{opacity:.55;cursor:default}#state{font-size:.9rem;color:#aaa}#state.active{color:#ff6b6b;font-weight:700}#state.acked{color:#81c784;font-weight:700}main{padding:1rem;display:grid;gap:1rem}.card{background:#151515;border:1px solid #333;border-radius:8px;padding:1rem}.card h2{margin:.1rem 0 .8rem;font-size:1.05rem}.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}label{display:grid;gap:.3rem;font-size:.85rem;color:#bbb}input{width:100%;padding:.65rem;border:1px solid #455a64;border-radius:6px;background:#0d171c;color:#fff}.meta{font-size:.85rem;color:#aaa;line-height:1.5}.help{font-size:.78rem;color:#8fa3ad;line-height:1.35}.danger{color:#ff6b6b}.ok{color:#81c784}iframe{width:100%;height:56vh;border:0;background:#fff;border-radius:8px}
</style></head><body>
<header>
<button id="ack-btn" onclick="ackErrors()">Acquitter les erreurs</button>
<span id="state">Lecture...</span>
<a href="/index.html" style="margin-left:auto;color:#4fc3f7;text-decoration:none">Retour</a>
</header>
<main>
<section class="card">
<h2>Incident carte SD</h2>
<div id="incident" class="meta">Lecture...</div>
<div class="row" style="margin-top:.8rem"><button id="incident-ack" class="good" onclick="ackIncident()">Acquitter l'incident</button></div>
</section>
<section class="card">
<h2>Notifications ntfy</h2>
<div class="grid">
<label><span>Serveur HTTPS</span><input id="ntfy-server" value="https://ntfy.sh"><span class="help">Adresse du service qui transporte les notifications. Conserver https://ntfy.sh pour le service public officiel.</span></label>
<label><span>Sujet privé</span><input id="ntfy-topic" autocomplete="off" placeholder="aqualook-7f3c9d2e-long-et-prive"><span class="help">Nom du canal ntfy auquel ton téléphone s'abonne. Toute personne connaissant ce nom peut potentiellement recevoir les messages si aucun jeton n'est utilisé. Choisir une chaîne longue et difficile à deviner.</span></label>
<label><span>Jeton d'accès facultatif</span><input id="ntfy-token" type="password" autocomplete="new-password" placeholder="Laisser vide si aucun compte ntfy n'est utilisé"><span class="help">Clé d'authentification fournie par ntfy lorsque le sujet est protégé par un compte. Pour un sujet privé long sur ntfy.sh sans compte, ce champ peut rester vide.</span></label>
</div>
<div class="row" style="margin-top:.8rem">
<label style="display:flex;align-items:center;gap:.5rem"><input id="ntfy-enabled" type="checkbox" style="width:auto"> Activer</label>
<button class="secondary" onclick="saveNtfy()">Enregistrer</button>
<button class="secondary" onclick="testNtfy()">Envoyer un test</button>
<button class="danger-action" onclick="resetNtfy()">Réinitialiser sujet et jeton</button>
</div>
<div class="help" style="margin-top:.6rem">La réinitialisation désactive ntfy, vide le sujet et efface définitivement le jeton enregistré en NVS. Le serveur revient à https://ntfy.sh.</div>
<div id="ntfy-status" class="meta" style="margin-top:.8rem">Lecture...</div>
</section>
<section class="card"><h2>Journal technique</h2><iframe id="journal" src="/api/logs"></iframe></section>
</main>
<script>
const $=id=>document.getElementById(id);
let ntfyFormInitialized=false;
let ntfyFormDirty=false;

for(const id of ['ntfy-server','ntfy-topic','ntfy-token','ntfy-enabled']){
 const el=$(id);
 el.addEventListener('input',()=>{ntfyFormDirty=true});
 el.addEventListener('change',()=>{ntfyFormDirty=true});
}

async function getJson(url,opt){const r=await fetch(url,{cache:'no-store',...(opt||{})});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function refreshFaults(){const btn=$('ack-btn'),state=$('state');try{const d=await getJson('/api/faults');state.className='';if(d.unacknowledged){btn.disabled=false;btn.textContent='Acquitter les erreurs';state.textContent=d.active?'Erreur active non acquittee':'Erreur memorisee non acquittee';state.classList.add('active')}else{btn.disabled=true;btn.textContent='Erreurs acquittees';state.textContent=d.active?'Defaut toujours present':'Aucune alarme non acquittee';state.classList.add('acked')}}catch(e){state.textContent='Etat indisponible'}}
async function ackErrors(){await fetch('/api/logs/ack',{method:'POST',cache:'no-store'});$('journal').contentWindow.location.reload();await refreshFaults()}
async function refreshIncident(){const box=$('incident'),btn=$('incident-ack');try{const d=await getJson('/api/incidents/storage-sd');const active=d.state==='active',none=d.state==='none',acked=d.state==='acknowledged';box.innerHTML='<b class="'+(active?'danger':'ok')+'">Etat : '+d.state+'</b><br>Occurrences : '+d.occurrences+'<br>Derniere cause : '+(d.lastReason||'-')+'<br>Notifications en attente : 0x'+Number(d.pendingNotifications||0).toString(16).padStart(2,'0');btn.disabled=active||none||acked;btn.textContent=active?'Incident actif - acquittement bloque':(acked?'Incident acquitte':'Acquitter l\'incident')}catch(e){box.textContent='Incident indisponible';btn.disabled=true}}
async function ackIncident(){try{await getJson('/api/incidents/storage-sd/ack',{method:'POST'});await refreshIncident()}catch(e){alert('Acquittement impossible : '+e.message)}}
async function refreshNtfy(forceFormSync=false){const box=$('ntfy-status');try{const d=await getJson('/api/notifications');if(forceFormSync||!ntfyFormInitialized){$('ntfy-enabled').checked=!!d.enabled;$('ntfy-server').value=d.server||'https://ntfy.sh';$('ntfy-topic').value=d.topic||'';$('ntfy-token').value='';ntfyFormInitialized=true;ntfyFormDirty=false}box.innerHTML='Configure : '+(d.configured?'oui':'non')+' — Jeton : '+(d.tokenConfigured?'present':'absent')+'<br>File incidents : 0x'+Number(d.pendingMask||0).toString(16).padStart(2,'0')+' — Tentatives : '+d.attempts+' — Prochaine : '+d.nextAttemptInSec+' s<br>Dernier resultat : '+d.lastResult+' — HTTP : '+d.lastHttpCode+(ntfyFormDirty?'<br><span class="help">Modifications non enregistrees dans le formulaire.</span>':'')}catch(e){box.textContent='Etat ntfy indisponible'}}
async function saveNtfy(){const body={enabled:$('ntfy-enabled').checked,server:$('ntfy-server').value.trim(),topic:$('ntfy-topic').value.trim(),token:$('ntfy-token').value,preserveToken:true};try{await getJson('/api/notifications/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});ntfyFormDirty=false;await refreshNtfy(true)}catch(e){alert('Configuration refusee : '+e.message)}}
async function resetNtfy(){if(!confirm('Désactiver ntfy et effacer définitivement le sujet et le jeton enregistrés en NVS ?'))return;const body={enabled:false,server:'https://ntfy.sh',topic:'',token:'',preserveToken:false};try{await getJson('/api/notifications/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('ntfy-enabled').checked=false;$('ntfy-server').value='https://ntfy.sh';$('ntfy-topic').value='';$('ntfy-token').value='';ntfyFormDirty=false;ntfyFormInitialized=true;await refreshNtfy(true)}catch(e){alert('Réinitialisation impossible : '+e.message)}}
async function testNtfy(){try{await getJson('/api/notifications/test',{method:'POST'});await refreshNtfy()}catch(e){alert('Test impossible : '+e.message)}}
async function refreshAll(){await Promise.all([refreshFaults(),refreshIncident(),refreshNtfy(false)])}
refreshAll();setInterval(refreshAll,2000);
</script></body></html>
