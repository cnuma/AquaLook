<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AquaLook - Journal</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#ddd;font-family:sans-serif}header{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;background:#151515;position:sticky;top:0;z-index:2}button{border:1px solid #ef5350;border-radius:6px;padding:.65rem 1rem;background:#b71c1c;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#263238;border-color:#607d8b}button.good{background:#1b5e20;border-color:#43a047}button.danger-action{background:#4a1717;border-color:#ef5350}button:disabled{opacity:.55;cursor:default}#state{font-size:.9rem;color:#aaa}#state.active{color:#ff6b6b;font-weight:700}#state.acked{color:#81c784;font-weight:700}main{padding:1rem;display:grid;gap:1rem}.card{background:#151515;border:1px solid #333;border-radius:8px;padding:1rem}.card h2{margin:.1rem 0 .8rem;font-size:1.05rem}.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}label{display:grid;gap:.3rem;font-size:.85rem;color:#bbb}input{width:100%;padding:.65rem;border:1px solid #455a64;border-radius:6px;background:#0d171c;color:#fff}input.invalid{border-color:#ef5350;box-shadow:0 0 0 1px #ef535055}.meta{font-size:.85rem;color:#aaa;line-height:1.5}.help{font-size:.78rem;color:#8fa3ad;line-height:1.35}.field-error{min-height:1.1rem;font-size:.78rem;color:#ff6b6b}.danger{color:#ff6b6b}.ok{color:#81c784}#journal{width:100%;height:56vh;overflow:auto;margin:0;padding:.8rem;border:1px solid #263238;border-radius:8px;background:#050505;color:#d7e3e8;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}#journal-state{font-size:.78rem;color:#8fa3ad}.log-err{color:#ff6b6b}.log-wrn{color:#ffb74d}.log-inf{color:#8fa3ad}.log-code{border-bottom:1px dotted #4fc3f7;cursor:help}
</style></head><body>
<header>
<button id="ack-btn">Acquitter les erreurs</button>
<span id="state">Lecture...</span>
<a href="/sante.html" style="margin-left:auto;color:#4fc3f7;text-decoration:none">Santé</a>
<a href="/index.html" style="color:#4fc3f7;text-decoration:none">Retour</a>
</header>
<main>
<section class="card">
<h2>Incident carte SD</h2>
<div id="incident" class="meta">Lecture...</div>
<div class="row" style="margin-top:.8rem"><button id="incident-ack" class="good">Acquitter l'incident</button></div>
</section>
<section class="card"><div class="row"><h2 style="margin-right:auto">Journal technique</h2><span id="journal-state">Lecture...</span><button class="secondary" id="journal-refresh">Actualiser</button></div>
<div class="row" style="margin-top:.3rem"><label style="display:flex;flex-direction:row;align-items:center;gap:.4rem;font-size:.82rem;color:#bbb;cursor:pointer"><input type="checkbox" id="timing-logs" style="width:auto"> Journaliser les warnings de lenteur ("Timing: ...", "boucle lente")</label></div>
<p class="help" style="margin:.3rem 0 0">Utiles en diagnostic (mesure du temps de chaque composant), mais bavards une fois le point etudie resolu. Preference persistee, n'affecte pas les autres logs (erreurs, WiFi...).</p>
<pre id="journal" aria-live="polite"></pre></section>
</main>
<script src="/hmac.js"></script><script src="/session.js"></script><script src="/logs.js"></script></body></html>
