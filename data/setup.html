<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AquaLook — Configuration WiFi</title><style>body{font-family:sans-serif;background:#1a1a2e;color:#eee;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#16213e;border-radius:12px;padding:2rem;width:90%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.4)}h2{margin:0 0 1.5rem;text-align:center;color:#4fc3f7}label{display:block;margin-bottom:.3rem;font-size:.9rem;color:#90caf9}input,select{width:100%;box-sizing:border-box;padding:.6rem .8rem;border:1px solid #334;border-radius:6px;background:#0f3460;color:#eee;font-size:1rem;margin-bottom:1rem}select:disabled{opacity:.6}select option{background:#0f3460}button{width:100%;padding:.75rem;border:0;border-radius:6px;background:#4fc3f7;color:#000;font-size:1rem;font-weight:600;cursor:pointer}#scan-hint{font-size:.78rem;color:#90caf9;margin:-.6rem 0 1rem;line-height:1.4}#msg{margin-top:1rem;text-align:center;font-size:.9rem}</style></head><body><div class="card"><h2>&#127807; Configuration WiFi</h2><label for="networks">Réseau WiFi (SSID)</label><select id="networks" disabled><option value="">Recherche des réseaux…</option></select><div id="scan-hint">La liste est établie une seule fois au démarrage du portail. Pour l'actualiser, redémarre le module et reconnecte-toi au réseau « Arrosage-Setup ». Tu peux aussi saisir un SSID manuellement ci-dessous.</div><label for="ssid">Nom du réseau (si absent de la liste)</label><input id="ssid" type="text" placeholder="Nom du réseau" autocomplete="off"><label for="pwd">Mot de passe</label><input id="pwd" type="password" placeholder="Mot de passe"><button type="button" id="save">Enregistrer et connecter</button><div id="msg"></div></div><script src="/hmac.js"></script><script src="/session.js"></script><script src="/setup.js"></script></body></html>
