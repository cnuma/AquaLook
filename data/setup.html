<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AquaLook — Configuration WiFi</title><style>body{font-family:sans-serif;background:#1a1a2e;color:#eee;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#16213e;border-radius:12px;padding:2rem;width:90%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.4)}h2{margin:0 0 1.5rem;text-align:center;color:#4fc3f7}label{display:block;margin-bottom:.3rem;font-size:.9rem;color:#90caf9}input,select{width:100%;box-sizing:border-box;padding:.6rem .8rem;border:1px solid #334;border-radius:6px;background:#0f3460;color:#eee;font-size:1rem;margin-bottom:1rem}select option{background:#0f3460}.row{display:flex;gap:.5rem;margin-bottom:1rem}.row input{margin-bottom:0;flex:1}.scan{flex-shrink:0;padding:.6rem .9rem;border:1px solid #4fc3f7;border-radius:6px;background:transparent;color:#4fc3f7;font-size:.9rem;cursor:pointer;white-space:nowrap}.scan:disabled{opacity:.5;cursor:default}button{width:100%;padding:.75rem;border:0;border-radius:6px;background:#4fc3f7;color:#000;font-size:1rem;font-weight:600;cursor:pointer}#networks{display:none}#msg{margin-top:1rem;text-align:center;font-size:.9rem}</style></head><body><div class="card"><h2>&#127807; Configuration WiFi</h2><label for="ssid">Réseau WiFi (SSID)</label><div class="row"><input id="ssid" type="text" placeholder="Nom du réseau" autocomplete="off"><button class="scan" id="scan" type="button" onclick="startScan()">&#128246; Scanner</button></div><select id="networks" onchange="pick(this.value)"><option value="">-- Sélectionner un réseau --</option></select><label for="pwd">Mot de passe</label><input id="pwd" type="password" placeholder="Mot de passe"><button type="button" onclick="saveWifi()">Enregistrer et connecter</button><div id="msg"></div></div><script>const $=id=>document.getElementById(id);let timer=null,scanStarted=0,scanErrors=0;const SCAN_TIMEOUT_MS=15000,SCAN_POLL_MS=650,SCAN_RETRY_MS=900;function message(text,color){$('msg').textContent=text;$('msg').style.color=color||'#eee'}function resetScanButton(){const b=$('scan');b.disabled=false;b.innerHTML='&#128246; Scanner'}function startScan(){if(timer){clearTimeout(timer);timer=null}scanStarted=Date.now();scanErrors=0;const b=$('scan');b.disabled=true;b.textContent='Recherche…';message('Recherche des réseaux…','#4fc3f7');pollScan(true)}async function pollScan(first){if(Date.now()-scanStarted>SCAN_TIMEOUT_MS){resetScanButton();message('Scan trop long — réessayez','#f66');return}try{const r=await fetch('/api/wifi/scan',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.scanning){timer=setTimeout(()=>pollScan(false),SCAN_POLL_MS);return}done(d)}catch(e){scanErrors++;message('Scan en cours… reconnexion '+scanErrors,'#4fc3f7');timer=setTimeout(()=>pollScan(false),SCAN_RETRY_MS)}}function done(d){if(timer){clearTimeout(timer);timer=null}resetScanButton();const s=$('networks');s.innerHTML='<option value="">-- Sélectionner un réseau --</option>';const n=d.networks||[];if(!n.length){s.style.display='none';message('Aucun réseau trouvé','#ff9800');return}n.forEach(x=>{const o=document.createElement('option');o.value=x.ssid;o.textContent=x.ssid+' ('+x.rssi+' dBm)'+(x.secured?' 🔒':'');s.appendChild(o)});s.style.display='block';message(n.length+' réseau(x) trouvé(s)','#81c784')}function pick(v){if(v){$('ssid').value=v;$('pwd').focus()}}async function saveWifi(){const ssid=$('ssid').value.trim(),pwd=$('pwd').value.trim();if(!ssid){message('SSID requis','#f66');return}message('Enregistrement…','#4fc3f7');try{const r=await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid,pwd})});message(r.ok?'✓ Enregistré — redémarrage…':'Erreur serveur',r.ok?'#81c784':'#f66')}catch(e){message('Erreur réseau','#f66')}}</script></body></html>
