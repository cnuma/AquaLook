; tactile, SD ou relais - uniquement le MCU et sa PSRAM.
; Selectionner "test_boot_s3" dans la barre PlatformIO en bas de VSCode
[env:test_boot_s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
