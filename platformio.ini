; PlatformIO Project Configuration File
; ── Environnement principal ───────────────────
[env:ProgrammeArrosage]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.0.8
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
build_src_filter = 
    +<*> 
    -<calibration_touch.cpp>
    -<test_relais.cpp>
    -<main_debug.cpp>
    -<main_nominal.cpp>
board_build.partitions = partitions_aqualook_dev.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DJPEG_MAX_WIDTH=320
    -DJPEG_MAX_HEIGHT=240

; ── Section commune build_flags ───────────────
; Utilisée par l'env calibration via ${common.build_flags}
[common]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ── Environnement calibration touch ──────────
; Flashe uniquement calibration_touch.cpp
; Sélectionner "calibration" dans la barre PlatformIO en bas de VSCode
[env:calibration]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
build_src_filter =
    -<*>
    +<calibration_touch.cpp>
build_flags = ${common.build_flags}

; ── Environnement test relais XL9535 ─────────
; Flashe uniquement test_relais.cpp — diagnostic I2C + séquence relais
; Sélectionner "test_relais" dans la barre PlatformIO en bas de VSCode
[env:test_relais]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
lib_deps =
    Wire
lib_ignore =
    WebServer
build_src_filter =
    -<*>
    +<test_relais.cpp>
build_flags = ${common.build_flags}

; ── Environnement diagnostic boot interactif ─
; Renomme main.cpp -> main_nominal.cpp avant de flasher cet env
[env:debug_boot]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.0.8
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
build_src_filter =
    +<*>
    -<calibration_touch.cpp>
    -<test_relais.cpp>
    -<main_nominal.cpp>
board_build.partitions = partitions_aqualook_dev.csv
board_build.filesystem = littlefs
build_flags = ${env:ProgrammeArrosage.build_flags}
