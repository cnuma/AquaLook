; PlatformIO Project Configuration File
; ── Donnees LittleFS minimales ─────────────────
; data/ reste la source complete des ressources copiees sur la carte SD.
; littlefs/ contient uniquement les secours techniques indispensables.
[platformio]
data_dir = littlefs

; ── Environnement principal ───────────────────
; Le profil nominal reste explicitement LEGACY pendant la Phase 6.
[env:ProgrammeArrosage]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
extra_scripts = pre:tools/version_build.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    greiman/SdFat @ ^2.3.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
    tft_espi_compat_s3
build_src_filter =
    +<*>
    -<calibration_touch.cpp>
    -<test_relais.cpp>
    -<test_execution_engine.cpp>
    -<test_ota_https.cpp>
    -<main_debug.cpp>
    -<main_nominal.cpp>
    -<test_boot_s3.cpp>
    -<test_screen_s3.cpp>
    -<test_relay_s3.cpp>
    -<test_touch_s3.cpp>
    -<test_perf_s3.cpp>
    -<test_sd_s3.cpp>
    -<test_wifi_s3.cpp>
    -<test_direct_s3.cpp>
    -<test_sprite_s3.cpp>
    -<test_realdisplay_s3.cpp>
    -<test_rotation_s3.cpp>
    -<test_ws2812_s3.cpp>
    -<test_ws2812_simple_s3.cpp>
    -<test_ws2812_scope_s3.cpp>
    -<test_ws2812_zones_s3.cpp>
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Explicitement a 0 (et non omis) : meme convention que
    ; AQUALOOK_RELAY_BACKEND_LEGACY/_V4 ci-dessous - un macro absent
    ; vaut 0 dans un #if, mais l'ecrire vaut mieux que s'y fier.
    -DAQUALOOK_BOARD_S3=0
    -DAQUALOOK_TOUCH_GT911=0
    -Wl,--wrap=_Z5setupv
    -Wl,--wrap=_ZN14DisplayManager10showSplashEhPKc
    ; Selection compile-time du backend physique.
    ; Le profil nominal reste legacy : aucune zone V4 n'est activee.
    -DAQUALOOK_RELAY_BACKEND_LEGACY=1
    -DAQUALOOK_RELAY_BACKEND_V4=0
    ; Profil matériel V4 minimal : les types restent connus du modèle,
    ; mais seuls GPIO, I2C et VIRTUAL sont disponibles pour les futurs drivers V4.
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    -DSPI_DRIVER_SELECT=2
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; ── Profils backend Phase 6 ───────────────────
; Alias explicite du chemin historique. Il hérite sans changer le runtime.
[env:ProgrammeArrosage_legacy]
extends = env:ProgrammeArrosage

; Profil de compilation V4 expérimental.
; Il ne câble pas V4RelayPhysicalBackend dans main.cpp et ne migre aucune zone.
[env:ProgrammeArrosage_v4]
extends = env:ProgrammeArrosage
build_unflags =
    -DAQUALOOK_RELAY_BACKEND_LEGACY=1
    -DAQUALOOK_RELAY_BACKEND_V4=0
build_flags =
    ${env:ProgrammeArrosage.build_flags}
    -DAQUALOOK_RELAY_BACKEND_LEGACY=0
    -DAQUALOOK_RELAY_BACKEND_V4=1

; ── Portage ESP32-S3 JC4827W543C_I — Phase A ──
; Socle de compilation + splash (docs/architecture/HW_JC4827W543_PORT_IMPACT.md
; §9, plan de portage en cours sur hw/jc4827w543-esp32s3-port-v2). Ecran/
; tactile via l'adaptateur prive tft_espi_compat_s3 (lib/), PAS bodmer/
; TFT_eSPI ni XPT2046_Touchscreen : DisplayManager.cpp et consorts
; compilent sans une seule ligne modifiee pour la partie dessin - seule
; la bibliotheque liee differe. Ecrit a la main plutot que via `extends`
; volontairement : `extends` aurait aussi heritee des ~15 -DTFT_*/
; -DILI9341_2_DRIVER de l'env legacy, sans objet et source de confusion
; ici. build_src_filter reste identique (memes bancs de test jetables
; exclus) - reference directe pour ne jamais diverger involontairement.
[env:ProgrammeArrosage_s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/version_build.py
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM4
monitor_port = COM4
; USB natif du S3 : sans DTR asserte, le moniteur reste MUET et on
; croit a tort que le module est silencieux. Equivalent de --dtr 1
; en ligne de commande, pour que le bouton de la barre PlatformIO
; fonctionne directement.
monitor_dtr = 1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    greiman/SdFat @ ^2.3.1
    moononournation/GFX Library for Arduino @ 1.4.9
    tamctec/TAMC_GT911
    ; Voyant d'etat : ruban WS2812 externe, faute de LED RGB embarquee
    ; sur cette carte. Absent des environnements de la carte historique,
    ; qui pilotent leur voyant en LEDC (voir src/StatusLed.cpp).
    adafruit/Adafruit NeoPixel @ ^1.12.0
lib_ignore =
    WebServer
build_src_filter = ${env:ProgrammeArrosage.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=_Z5setupv
    -Wl,--wrap=_ZN14DisplayManager10showSplashEhPKc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DAQUALOOK_BOARD_S3=1
    -DAQUALOOK_TOUCH_GT911=1
    ; Profil relais : LEGACY par defaut, comme le profil nominal actuel -
    ; le cablage fonctionnel du XL9535 dans RelaisManager pour cette
    ; carte est hors perimetre de la phase A (voir le plan de portage).
    -DAQUALOOK_RELAY_BACKEND_LEGACY=1
    -DAQUALOOK_RELAY_BACKEND_V4=0
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    ${jc4827w543c_i.build_flags}

; ── Banc moteur d'exécution passif Phase 6 ────
; Flashe uniquement le moteur passif et ses scénarios déterministes.
; Aucun runtime, relais ou backend physique n'est inclus.
[env:test_execution_engine]
platform = espressif32 @ 6.13.0
board = esp32dev
