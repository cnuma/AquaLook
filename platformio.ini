; ── Banc OTA-1 HTTPS/TLS isole ────────────────
; Firmware temporaire sans moteur d'arrosage ni ecriture OTA.
; Toujours reflasher ProgrammeArrosage apres le relevé des logs.
[env:test_ota_https]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM3
monitor_port = COM3
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
build_src_filter =
    -<*>
    +<ConfigManager.cpp>
    +<WiFiManager.cpp>
    +<EventLog.cpp>
    +<test_ota_https.cpp>
