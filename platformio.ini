    -<test_boot_s3.cpp>
    -<test_screen_s3.cpp>
    -<test_relay_s3.cpp>
    -<test_touch_s3.cpp>
    -<test_perf_s3.cpp>
    -<test_sd_s3.cpp>
    -<test_wifi_s3.cpp>
    -<test_direct_s3.cpp>
    -<test_sprite_s3.cpp>
