    ; vaut 0 dans un #if, mais l'ecrire vaut mieux que s'y fier.
    -DAQUALOOK_BOARD_S3=0
    -DAQUALOOK_TOUCH_GT911=0

; ── Banc S3 avec le backend relais V4 ─────────────────────────────────────
; Profil de bascule pour le Gate 2 : meme carte que ProgrammeArrosage_s3,
; mais la commande atteint le relais par le modele de ports V4 au lieu du
; chemin legacy. Le rollback est un reflash du profil s3 -- il n existe plus
; d arbitrage a l execution.
[env:ProgrammeArrosage_s3_v4]
extends = env:ProgrammeArrosage_s3
build_unflags =
build_flags =
    ${env:ProgrammeArrosage_s3.build_flags}
