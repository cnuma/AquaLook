; PlatformIO Project Configuration File
; ── Donnees LittleFS minimales ─────────────────
; data/ reste la source complete des ressources copiees sur la carte SD.
; littlefs/ contient uniquement les secours techniques indispensables.
[platformio]
data_dir = littlefs

; ── Reglages communs a TOUS les environnements ────
; PlatformIO fusionne ces build_flags avec ceux de chaque [env:...] : pas
; besoin de repeter la ligne dans chacun.
[env]
build_flags =
    ; AsyncTCP par defaut (-1 = "any core", priorite 10) peut atterrir sur
    ; le meme coeur que loopTask et la preempter pendant tout le traitement
    ; d'un evenement reseau (priorite 10 >> loopTask, largement superieure).
    ; Constate le 28 sept. 2026 sur ProgrammeArrosage_s3 (.141) : gel
    ; chronique ~400ms/1s deja documente (voir memoire
    ; checkpoint-2026-09-27-notifications-soir), NON explique par
    ; NTP/meteo/cloudSync/updateCheck (elimines un a un par test), correle
    ; a un flux HTTP continu (~2/s) et responsable des timeouts SD
    ; (StorageManager en lecture SPI au moment precis ou loopTask est
    ; preempte -- la carte voit l'horloge SPI s'arreter en plein transfert
    ; et le signale comme une vraie erreur cote materiel). Corrige en
    ; epinglant la tache reseau d'AsyncTCP au coeur 0, celui de la pile
    ; WiFi/lwIP -- deja le choix delibere de WeatherManager et CloudSync
    ; pour leurs propres taches reseau (voir leurs commentaires "epinglee
    ; au coeur 1... coeur 0 = pile WiFi/lwIP"), juste applique ici a
    ; AsyncTCP qui, seul, n'avait jamais ete epingle. Valide sur .141 sous
    ; bon RSSI (-60/-62 dBm) : loop.overrunCount tombe de ~1/s a ~0,008/s
    ; sur 650s, storage.slowCount reste a 0 (plus de "Read data timeout").
    ; MAIS un residu proche de l'ancien taux revient sous RSSI degrade
    ; (-84/-86 dBm, antenne .141 deja intermittente -- voir memoire
    ; s3-antenna-needs-reboot) : ce correctif reduit reellement le
    ; probleme mais ne le clot pas completement tant que ce second facteur
    ; (RSSI-dependant, probablement des retransmissions WiFi au niveau
    ; pilote plutot qu'un souci d'ordonnancement) n'est pas lui aussi
    ; traite. Voir memoire checkpoint-2026-09-28-gel-chronique-resolu
    ; pour le detail et les pistes non explorees. Non revalide isolement
    ; sur les autres environnements/cartes (portee par construction
    ; commune, pas par un second test materiel).
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; ── Environnement principal ───────────────────
; Le profil nominal reste explicitement LEGACY pendant la Phase 6.
[env:ProgrammeArrosage]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
extra_scripts =
    pre:tools/version_build.py
    pre:tools/patch_asyncwebserver.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    greiman/SdFat @ ^2.3.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
    tft_espi_compat_s3
build_src_filter =
    +<*>
    -<calibration_touch.cpp>
    -<test_relais.cpp>
    -<test_execution_engine.cpp>
    -<test_ota_https.cpp>
    -<main_debug.cpp>
    -<main_nominal.cpp>
    -<test_boot_s3.cpp>
    -<test_screen_s3.cpp>
    -<test_relay_s3.cpp>
    -<test_touch_s3.cpp>
    -<test_perf_s3.cpp>
    -<test_sd_s3.cpp>
    -<test_wifi_s3.cpp>
    -<test_direct_s3.cpp>
    -<test_sprite_s3.cpp>
    -<test_realdisplay_s3.cpp>
    -<test_rotation_s3.cpp>
    -<test_ws2812_s3.cpp>
    -<test_ws2812_simple_s3.cpp>
    -<test_ws2812_scope_s3.cpp>
    -<test_ws2812_zones_s3.cpp>
    ; Banc isole de validation CloudSync (30 sept.-1er oct. 2026, voir
    ; docs/checkpoints/CHECKPOINT_2026-10-01_cloudsync-outage-and-core1-contention.md)
    ; : chaque fichier definit son propre setup()/loop(), entrerait en
    ; conflit avec main.cpp.
    -<test_cloudsync_probe_common.cpp>
    -<test_cloudsync_probe.cpp>
    -<test_cloudsync_probe_asynctcp.cpp>
    -<test_cloudsync_probe_sd.cpp>
    -<test_cloudsync_probe_display.cpp>
    -<test_cloudsync_probe_combined.cpp>
    -<test_cloudsync_probe_wifimanager.cpp>
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Explicitement a 0 (et non omis) : meme convention que
    ; AQUALOOK_RELAY_BACKEND_LEGACY/_V4 ci-dessous - un macro absent
    ; vaut 0 dans un #if, mais l'ecrire vaut mieux que s'y fier.
    -DAQUALOOK_BOARD_S3=0
    -DAQUALOOK_TOUCH_GT911=0
    -Wl,--wrap=_Z5setupv
    -Wl,--wrap=_ZN14DisplayManager10showSplashEhPKc
    ; Selection compile-time du backend physique.
    ; Le profil nominal reste legacy : aucune zone V4 n'est activee.
    ; Profil matériel V4 minimal : les types restent connus du modèle,
    ; mais seuls GPIO, I2C et VIRTUAL sont disponibles pour les futurs drivers V4.
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    -DSPI_DRIVER_SELECT=2
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; ── Profils backend Phase 6 ───────────────────
; Alias explicite du chemin historique. Il hérite sans changer le runtime.
[env:ProgrammeArrosage_legacy]
extends = env:ProgrammeArrosage

; Profil de compilation V4 expérimental.
; Il ne câble pas V4RelayPhysicalBackend dans main.cpp et ne migre aucune zone.
[env:ProgrammeArrosage_v4]
extends = env:ProgrammeArrosage
build_unflags =
build_flags =
    ${env:ProgrammeArrosage.build_flags}

; ── Portage ESP32-S3 JC4827W543C_I — Phase A ──
; Socle de compilation + splash (docs/architecture/HW_JC4827W543_PORT_IMPACT.md
; §9, plan de portage en cours sur hw/jc4827w543-esp32s3-port-v2). Ecran/
; tactile via l'adaptateur prive tft_espi_compat_s3 (lib/), PAS bodmer/
; TFT_eSPI ni XPT2046_Touchscreen : DisplayManager.cpp et consorts
; compilent sans une seule ligne modifiee pour la partie dessin - seule
; la bibliotheque liee differe. Ecrit a la main plutot que via `extends`
; volontairement : `extends` aurait aussi heritee des ~15 -DTFT_*/
; -DILI9341_2_DRIVER de l'env legacy, sans objet et source de confusion
; ici. build_src_filter reste identique (memes bancs de test jetables
; exclus) - reference directe pour ne jamais diverger involontairement.
[env:ProgrammeArrosage_s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:tools/version_build.py
    pre:tools/patch_asyncwebserver.py
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM4
monitor_port = COM4
; USB natif du S3 : sans DTR asserte, le moniteur reste MUET et on
; croit a tort que le module est silencieux. Equivalent de --dtr 1
; en ligne de commande, pour que le bouton de la barre PlatformIO
; fonctionne directement.
monitor_dtr = 1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    greiman/SdFat @ ^2.3.1
    moononournation/GFX Library for Arduino @ 1.4.9
    tamctec/TAMC_GT911
    ; Voyant d'etat : ruban WS2812 externe, faute de LED RGB embarquee
    ; sur cette carte. Absent des environnements de la carte historique,
    ; qui pilotent leur voyant en LEDC (voir src/StatusLed.cpp).
    adafruit/Adafruit NeoPixel @ ^1.12.0
lib_ignore =
    WebServer
build_src_filter = ${env:ProgrammeArrosage.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=_Z5setupv
    -Wl,--wrap=_ZN14DisplayManager10showSplashEhPKc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DAQUALOOK_BOARD_S3=1
    -DAQUALOOK_TOUCH_GT911=1
    ; Profil relais : LEGACY par defaut, comme le profil nominal actuel -
    ; le cablage fonctionnel du XL9535 dans RelaisManager pour cette
    ; carte est hors perimetre de la phase A (voir le plan de portage).
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    ${jc4827w543c_i.build_flags}

; ── Banc parallele N16R8 sans ecran (29 sept. 2026) ────
; Meme firmware que ProgrammeArrosage_s3 (production complete, memes
; managers, memes broches AQ_S3_* de jc4827w543c_i), sur un module
; ESP32-S3-WROOM-1-N16R8 NU : ni ecran QSPI, ni tactile GT911, ni etage
; relais XL9535 cables -- seule la carte SD est branchee (GPIO10/11/12/13,
; SPI, voir platformio.ini:306-311). But : faire tourner un module
; identique cote logiciel EN PARALLELE de .141 pour isoler si le gel de
; fond (~700-770ms/1s) et les blocages CloudSync (~50-60s, voir memoire
; checkpoint-2026-09-29-cloudsync-watchdog) dependent de l'ecran/tactile/
; relais ou pas.
;
; L'absence physique de ces peripheriques est DEJA geree sans blocage par
; le firmware existant, d'apres son propre historique :
;   - tactile GT911 absent -> Wire.setTimeOut(10) empeche un blocage de la
;     boucle principale (DisplayManager::begin, commentaire du 29 aout
;     2026, deja constate sur materiel reel muet) ;
;   - relais XL9535 absent -> FaultManager::RELAY_I2C signale une fois,
;     aucun redemarrage ni blocage (main.cpp setup(), chemin explicitement
;     concu pour ce cas) ;
;   - ecran QSPI absent -> ecritures de commandes sans accuse attendu au
;     demarrage (_tft.init()), a priori sans blocage -- JAMAIS TESTE SANS
;     DALLE PHYSIQUEMENT BRANCHEE sur cette base de code precise. Si le
;     module reste muet (ni série ni HTTP) apres flash, c'est la premiere
;     hypothese a verifier.
;
; Unique difference reelle avec ProgrammeArrosage_s3 : la taille de flash
; (16 Mo au lieu de 4 Mo). Meme table de partitions (aqualook_partitions.csv,
; dimensionnee pour 4 Mo) : elle tient sans modification sur les 16 Mo
; disponibles, le surplus reste simplement inexploite pour l'instant -- pas
; un probleme pour un banc de test.
;
; upload_port/monitor_port DELIBEREMENT absents de cet environnement : ce
; module tourne EN PARALLELE de .141 (fixe sur COM4), donc sur un port COM
; different qui depend de l'ordre de branchement USB sur cette machine.
; Une fois le module branche, verifier son numero de port dans le
; Gestionnaire de peripheriques Windows, puis preciser
; --upload-port COMx (et --monitor-port COMx pour la capture serie).
[env:ProgrammeArrosage_s3_n16r8]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:tools/version_build.py
    pre:tools/patch_asyncwebserver.py
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; USB natif du S3 : sans DTR asserte, le moniteur reste MUET et on croit a
; tort que le module est silencieux (voir memoire s3-serial-needs-dtr).
monitor_dtr = 1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    greiman/SdFat @ ^2.3.1
    moononournation/GFX Library for Arduino @ 1.4.9
    tamctec/TAMC_GT911
    adafruit/Adafruit NeoPixel @ ^1.12.0
lib_ignore =
    WebServer
build_src_filter = ${env:ProgrammeArrosage.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=_Z5setupv
    -Wl,--wrap=_ZN14DisplayManager10showSplashEhPKc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DAQUALOOK_BOARD_S3=1
    -DAQUALOOK_TOUCH_GT911=1
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    ; Gamme produit affichee en haut de l'interface web du module (bandeau
    ; d'identite, voir data/index.html) : "Aqualook" (base, sans ecran) sur
    ; ce seul environnement -- tous les autres restent "Aqualook Pro" par
    ; defaut (voir SystemDiagnostics.cpp).
    -DAQUALOOK_PRODUCT_LINE=\"Aqualook\"
    ${jc4827w543c_i.build_flags}

; ── Banc isole de validation CloudSync (30 sept. 2026) ────
; Repond a la question "la panne CloudSync suit-elle le module, ou
; disparait-elle hors du contexte applicatif complet ?" (voir
; docs/checkpoints/CHECKPOINT_2026-10-01_cloudsync-outage-and-core1-contention.md).
; Ne contient QUE : connexion
; WiFi (identifiants demandes en serie, jamais committes, voir
; test_cloudsync_probe.cpp) + boucle de connexion TLS brute vers
; aqualook.alwaysdata.net avec le MEME paquet de confiance (OtaTlsTrust) et
; les MEMES timeouts (4s) que CloudSync.cpp -- aucun ConfigManager,
; WiFiManager, ecran, relais, planificateur, AsyncTCP. Impression serie a
; chaque tentative (duree, code d'erreur, heap).
;
; upload_port/monitor_port DELIBEREMENT absents : deux cibles possibles a
; choisir explicitement au moment du flash --
;   --upload-port COM4 : flashe SUR .141 (le module de production, celui qui
;     reproduit la panne) -- interrompt l'irrigation pilotee par ce module
;     pendant toute la duree du test (plus de planificateur/relais tant que
;     ce firmware minimal tourne). A ne faire qu'en connaissance de cause.
;   --upload-port COMx (carte de rechange, ex. le banc N16R8) : aucun impact
;     sur .141, mais depend d'une carte S3 supplementaire disponible et
;     cablee.
; Rollback : reflasher ProgrammeArrosage_s3 (ou _n16r8) pour retrouver le
; firmware complet.
[env:test_cloudsync_probe_s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; USB natif du S3 : sans DTR asserte, le moniteur reste MUET (deja
; rencontre sur ce materiel).
monitor_dtr = 1
build_src_filter =
    -<*>
    +<OtaTlsTrust.cpp>
    +<test_cloudsync_probe_common.cpp>
    +<test_cloudsync_probe.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ── Banc isole de validation CloudSync, ETAPE 2/N : + AsyncTCP ────
; Meme banc que test_cloudsync_probe_s3 (logique partagee dans
; test_cloudsync_probe_common.*), + un serveur ESPAsyncWebServer/AsyncTCP
; minimal (voir test_cloudsync_probe_asynctcp.cpp) pour tester l'hypothese
; de contention coeur 0 entre AsyncTCP et la pile WiFi/lwIP pendant une
; poignee de main TLS CloudSync -- deja la cause confirmee du "gel de fond"
; (memoire display-slow-rssi-redraw), donc le candidat le plus probable.
; Meme avertissement upload_port/monitor_port que l'etape 1 ci-dessus.
[env:test_cloudsync_probe_s3_asynctcp]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 1
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
build_src_filter =
    -<*>
    +<OtaTlsTrust.cpp>
    +<test_cloudsync_probe_common.cpp>
    +<test_cloudsync_probe_asynctcp.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ── Banc isole de validation CloudSync, ETAPE 3/N : + carte SD ────
