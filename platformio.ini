    -Wl,--wrap=_ZN14DisplayManager10showSplashEhPKc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DAQUALOOK_BOARD_S3=1
    -DAQUALOOK_TOUCH_GT911=1
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    ${jc4827w543c_i.build_flags}

; ── Test du ruban WS2812 (8 LED sur GPIO46) ──
; Remplacant du voyant RGB absent de cette carte. Voir l'en-tete de
; src/test_ws2812_s3.cpp, notamment la reserve sur le niveau logique
; 3,3 V face au seuil de 3,5 V attendu par un WS2812 alimente en 5 V.
; Selectionner "test_ws2812_s3" dans la barre PlatformIO en bas de VSCode
[env:test_ws2812_s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM4
monitor_port = COM4
; USB natif du S3 : sans DTR asserte, le moniteur reste MUET et on
; croit a tort que le module est silencieux. Equivalent de --dtr 1
; en ligne de commande, pour que le bouton de la barre PlatformIO
; fonctionne directement.
monitor_dtr = 1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
lib_ignore =
    WebServer
    tft_espi_compat_s3
build_src_filter =
    -<*>
    +<test_ws2812_s3.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ${jc4827w543c_i.build_flags}

; ── Banc autonome WS2812 (aucune action requise) ──
; Tourne tout seul : cinq motifs qui s'enchainent en boucle, 8 s chacun.
; Rien a taper, aucun moniteur serie a ouvrir - il suffit de flasher et
; de regarder le ruban. Voir l'en-tete de src/test_ws2812_simple_s3.cpp
; pour ce que chaque motif permet de conclure.
; Selectionner "test_ws2812_simple_s3" dans la barre PlatformIO de VSCode
[env:test_ws2812_simple_s3]
extends = env:test_ws2812_s3
build_src_filter =
    -<*>
    +<test_ws2812_simple_s3.cpp>

; ── Banc oscilloscope WS2812 (diagnostic de signal) ──
; A utiliser quand le ruban reste ETEINT alors que l'oscilloscope montre
; du trafic sur DIN. Envoie toujours la meme trame - LED 0 blanche, les
; autres eteintes - soit 24 bits a "1" puis 168 bits a "0" : T1H et T0H
; se mesurent cote a cote sur un seul ecran. Voir l'en-tete de
; src/test_ws2812_scope_s3.cpp pour la grille de lecture complete.
; Selectionner "test_ws2812_scope_s3" dans la barre PlatformIO de VSCode
[env:test_ws2812_scope_s3]
extends = env:test_ws2812_s3
build_src_filter =
    -<*>
    +<test_ws2812_scope_s3.cpp>

; ── Apercu du voyant AquaLook (9 LED : 8 zones + etat) ──
; Ne teste pas le ruban : montre le RENDU REEL que produira le firmware
; (LED 0 = etat general, LED 1 a 8 = zones dans leurs couleurs), pour le
; juger a l'oeil avant integration. Sept scenarios en boucle, rien a
; taper. Voir l'en-tete de src/test_ws2812_zones_s3.cpp.
; Selectionner "test_ws2812_zones_s3" dans la barre PlatformIO de VSCode
[env:test_ws2812_zones_s3]
extends = env:test_ws2812_s3
build_src_filter =
    -<*>
    +<test_ws2812_zones_s3.cpp>

; ── Test d'orientation NV3041A (balayage des 4 rotations) ──
; Test autonome : n'utilise ni DisplayManager ni l'adaptateur
; tft_espi_compat_s3, seulement Arduino_GFX directement, pour lever toute
; interference. Voir l'en-tete de src/test_rotation_s3.cpp.
; Selectionner "test_rotation_s3" dans la barre PlatformIO en bas de VSCode
[env:test_rotation_s3]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = aqualook_partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM4
monitor_port = COM4
; USB natif du S3 : sans DTR asserte, le moniteur reste MUET et on
; croit a tort que le module est silencieux. Equivalent de --dtr 1
; en ligne de commande, pour que le bouton de la barre PlatformIO
; fonctionne directement.
monitor_dtr = 1
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.9
lib_ignore =
    WebServer
    tft_espi_compat_s3
build_src_filter =
    -<*>
    +<test_rotation_s3.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ${jc4827w543c_i.build_flags}

; ── Environnement diagnostic boot interactif ─
; Renomme main.cpp -> main_nominal.cpp avant de flasher cet env
[env:debug_boot]
platform = espressif32 @ 6.13.0
