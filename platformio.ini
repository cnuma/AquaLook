; ── Section commune build_flags - carte JC4827W543C_I ─
; Guition ESP32-S3-WROOM-1-N4R8, ecran NV3041A QSPI 480x272, tactile
; GT911 capacitif I2C. Source de verite unique du brochage, utilisee par
; tous les env test_*_s3 via ${jc4827w543c_i.build_flags} - evite les
; #define disperses et divergents entre fichiers de test.
;
; Statut au 27 aout 2026 : ecran/tactile/relais/SD CONFIRMES sur
; materiel reel (tests 1,2,3,4,5,6,8 - voir
; docs/architecture/HW_JC4827W543_PORT_IMPACT.md §8). Reste le test 9
; (WiFi) ; le 7 (voyant RGB) est conditionnel, sans objet sans WS2812
; cable.
[jc4827w543c_i]
build_flags =
    ; Identite carte / dalle
    -DAQ_S3_SCREEN_WIDTH=480
    -DAQ_S3_SCREEN_HEIGHT=272
    ; Ecran NV3041A, bus QSPI (confirme sur materiel reel le 26 aout 2026)
    -DAQ_S3_LCD_CS=45
    -DAQ_S3_LCD_SCK=47
    -DAQ_S3_LCD_D0=21
    -DAQ_S3_LCD_D1=48
    -DAQ_S3_LCD_D2=40
    -DAQ_S3_LCD_D3=39
    -DAQ_S3_LCD_IPS=1
    -DAQ_S3_LCD_BL=1
    -DAQ_S3_LCD_BL_CHANNEL=0
    ; Tactile GT911, I2C dedie (confirme sur materiel reel le 27 aout 2026)
    ; Rotation 1 = ROTATION_INVERTED (TAMC_GT911.h) : ROTATION_NORMAL
    ; donnait les deux axes inverses sur cette carte.
    -DAQ_S3_TOUCH_SDA=8
    -DAQ_S3_TOUCH_SCL=4
    -DAQ_S3_TOUCH_RST=38
    -DAQ_S3_TOUCH_INT=3
    -DAQ_S3_TOUCH_ROTATION=1
    ; Bloc relais XL9535, I2C dedie distinct du tactile - cablage propre
    ; a ce banc de test, pas une caracteristique de la carte elle-meme
    ; (confirme sur materiel reel le 26 aout 2026, logique DIRECTE comme
    ; RelayTopology::LOGIC_DIRECT deja etabli pour la carte actuelle)
    -DAQ_S3_RELAY_SCL=17
    -DAQ_S3_RELAY_SDA=18
    -DAQ_S3_RELAY_ADDR=0x20
    ; Carte SD, bus SPI dedie distinct du QSPI ecran (confirme sur
    ; materiel reel le 27 aout 2026 - SDHC, ecriture/lecture identique)
    -DAQ_S3_SD_MISO=13
    -DAQ_S3_SD_MOSI=11
    -DAQ_S3_SD_SCLK=12
    -DAQ_S3_SD_CS=10
    ; Ruban WS2812 externe : cette carte n'a aucun voyant RGB embarque
    ; (HW_JC4827W543_PORT_IMPACT.md §8 test 7). GPIO46 est la seule
    ; broche encore libre de tout peripherique ci-dessus.
    ;
    ; C'est aussi une broche de strapping de l'ESP32-S3 (controle de
    ; l'affichage des messages ROM au demarrage), tiree au bas en
    ; interne. L'entree de donnees d'un WS2812 ne tire pas au haut,
    ; donc le demarrage n'est pas affecte - mais ne pas y ajouter de
    ; resistance de tirage au haut.
    ;
    ; Luminosite plafonnee : 9 LED en blanc plein tireraient ~540 mA,
    ; au-dela de ce que le rail 5 V du module supporte.
    -DAQ_S3_LED_PIN=46
    -DAQ_S3_LED_BRIGHTNESS=40

