; PlatformIO Project Configuration File
; ── Donnees LittleFS minimales ─────────────────
; data/ reste la source complete des ressources copiees sur la carte SD.
; littlefs/ contient uniquement les secours techniques indispensables.
[platformio]
data_dir = littlefs

; ── Environnement principal ───────────────────
; Le profil nominal reste explicitement LEGACY pendant la Phase 6.
[env:ProgrammeArrosage]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
extra_scripts = pre:tools/version_build.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    greiman/SdFat @ ^2.3.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
build_src_filter = 
    +<*> 
    -<calibration_touch.cpp>
    -<test_relais.cpp>
    -<test_execution_engine.cpp>
    -<test_ota_https.cpp>
    -<main_debug.cpp>
    -<main_nominal.cpp>
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=_Z5setupv
    ; Selection compile-time du backend physique.
    ; Le profil nominal reste legacy : aucune zone V4 n'est activee.
    -DAQUALOOK_RELAY_BACKEND_LEGACY=1
    -DAQUALOOK_RELAY_BACKEND_V4=0
    ; Profil matériel V4 minimal : les types restent connus du modèle,
    ; mais seuls GPIO, I2C et VIRTUAL sont disponibles pour les futurs drivers V4.
    -DAQUALOOK_V4_ENABLE_GPIO=1
    -DAQUALOOK_V4_ENABLE_I2C=1
    -DAQUALOOK_V4_ENABLE_SPI=0
    -DAQUALOOK_V4_ENABLE_UART=0
    -DAQUALOOK_V4_ENABLE_ONEWIRE=0
    -DAQUALOOK_V4_ENABLE_CAN=0
    -DAQUALOOK_V4_ENABLE_RS485=0
    -DAQUALOOK_V4_ENABLE_REMOTE=0
    -DAQUALOOK_V4_ENABLE_VIRTUAL=1
    -DSPI_DRIVER_SELECT=2
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; ── Profils backend Phase 6 ───────────────────
; Alias explicite du chemin historique. Il hérite sans changer le runtime.
[env:ProgrammeArrosage_legacy]
extends = env:ProgrammeArrosage

; Profil de compilation V4 expérimental.
; Il ne câble pas V4RelayPhysicalBackend dans main.cpp et ne migre aucune zone.
[env:ProgrammeArrosage_v4]
extends = env:ProgrammeArrosage
build_unflags =
    -DAQUALOOK_RELAY_BACKEND_LEGACY=1
    -DAQUALOOK_RELAY_BACKEND_V4=0
build_flags =
    ${env:ProgrammeArrosage.build_flags}
    -DAQUALOOK_RELAY_BACKEND_LEGACY=0
    -DAQUALOOK_RELAY_BACKEND_V4=1

; ── Banc moteur d'exécution passif Phase 6 ────
; Flashe uniquement le moteur passif et ses scénarios déterministes.
; Aucun runtime, relais ou backend physique n'est inclus.
[env:test_execution_engine]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
build_src_filter =
    -<*>
    +<EquipmentExecutionEngine.cpp>
    +<test_execution_engine.cpp>

; ── Section commune build_flags ───────────────
; Utilisée par l'env calibration via ${common.build_flags}
[common]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; ── Environnement calibration touch ──────────
; Flashe uniquement calibration_touch.cpp
; Sélectionner "calibration" dans la barre PlatformIO en bas de VSCode
[env:calibration]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
build_src_filter =
    -<*>
    +<calibration_touch.cpp>
build_flags = ${common.build_flags}

; ── Environnement test relais XL9535 ─────────
; Flashe uniquement test_relais.cpp — diagnostic I2C + séquence relais
; Sélectionner "test_relais" dans la barre PlatformIO en bas de VSCode
[env:test_relais]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
lib_deps =
    Wire
lib_ignore =
    WebServer
build_src_filter =
    -<*>
    +<test_relais.cpp>
build_flags = ${common.build_flags}

; ── Environnement diagnostic boot interactif ─
; Renomme main.cpp -> main_nominal.cpp avant de flasher cet env
[env:debug_boot]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
extra_scripts = pre:tools/version_build.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM9
monitor_port = COM9
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    greiman/SdFat @ ^2.3.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#master
lib_ignore =
    WebServer
build_src_filter =
    +<*>
    -<calibration_touch.cpp>
    -<test_relais.cpp>
    -<test_execution_engine.cpp>
    -<test_ota_https.cpp>
    -<main_nominal.cpp>
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
build_flags = ${env:ProgrammeArrosage.build_flags}

; ── Banc OTA-1 HTTPS/TLS isole ────────────────
; Firmware temporaire sans moteur d'arrosage ni ecriture OTA.
; Toujours reflasher ProgrammeArrosage apres le relevé des logs.
[env:test_ota_https]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM3
monitor_port = COM3
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
build_src_filter =
    -<*>
    +<ConfigManager.cpp>
    +<WiFiManager.cpp>
    +<EventLog.cpp>
    +<test_ota_https.cpp>
board_build.partitions = aqualook_partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAQUALOOK_RELAY_BACKEND_LEGACY=1
    -DAQUALOOK_RELAY_BACKEND_V4=0
