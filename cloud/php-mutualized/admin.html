<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AquaLook — console d'administration</title>
<style>
:root {
  --bg: #0e1720; --bg2: #16232f; --bg3: #1e3040;
  --line: #27394a; --text: #e7f1f8; --muted: #8ba6ba;
  --blue: #29b6f6; --green: #4caf50; --amber: #ffb300; --red: #ef5350;
  --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 18px; background: var(--bg2); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
h1 span { color: var(--blue); }
.spacer { flex: 1; }
input, select, textarea, button {
  font: inherit; color: var(--text); background: var(--bg3);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
}
textarea { font-family: var(--mono); font-size: 12px; width: 100%; resize: vertical; }
button { cursor: pointer; background: var(--bg3); }
button:hover:not(:disabled) { border-color: var(--blue); }
button.primary { background: var(--blue); color: #06131c; border-color: var(--blue); font-weight: 600; }
button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
button:disabled { opacity: .45; cursor: not-allowed; }
main { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: calc(100vh - 53px); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
#modules { border-right: 1px solid var(--line); background: var(--bg2); padding: 10px; }
#detail { padding: 18px; min-width: 0; }
.mod {
  display: block; width: 100%; text-align: left; margin-bottom: 6px;
  background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 11px;
}
.mod:hover { background: var(--bg3); }
.mod.sel { background: var(--bg3); border-color: var(--blue); }
.mod-id { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.mod-meta { color: var(--muted); font-size: 11.5px; font-family: var(--mono); margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.ok { background: var(--green); } .dot.warn { background: var(--amber); } .dot.ko { background: var(--red); }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 10px; }
label { color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-family: var(--mono); border: 1px solid var(--line); }
.tag.pending { color: var(--amber); border-color: var(--amber); }
.tag.accepted { color: var(--green); border-color: var(--green); }
.tag.refused, .tag.failed { color: var(--red); border-color: var(--red); }
.tag.expired { color: var(--muted); }
details > summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border-radius: 6px; overflow-x: auto; font-size: 11.5px; font-family: var(--mono); }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button.on { border-color: var(--blue); color: var(--blue); }
.empty { color: var(--muted); font-style: italic; padding: 8px; }
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg3); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 18px; opacity: 0; transition: .2s; pointer-events: none; max-width: 90vw; z-index: 20;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { border-color: var(--red); color: var(--red); }
.hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
.token-out { font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--amber); background: var(--bg); padding: 10px; border-radius: 6px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>Aqua<span>Look</span> — administration</h1>
  <div class="spacer"></div>
  <input type="password" id="tok" placeholder="jeton administrateur" style="width:250px" autocomplete="off">
  <button class="primary" id="btn-login">Connexion</button>
  <button id="btn-logout" hidden>Déconnexion</button>
</header>

<main>
  <nav id="modules"><div class="empty">Saisir le jeton pour commencer.</div></nav>
  <section id="detail"><div class="empty">Aucun module sélectionné.</div></section>
</main>

<div id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
