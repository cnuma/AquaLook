# Broker MQTT AquaLook
#
# Deux ecouteurs :
#   1883 en clair, reserve au reseau local et aux conteneurs voisins ;
#   8883 en TLS, le seul a exposer au-dela du reseau local.
#
# Aucun acces anonyme : chaque module possede ses propres identifiants et ne
# peut ecrire que dans son sous-arbre (voir acl). Exigences reprises de
# docs/architecture/SYSTEM_ARCHITECTURE.md, section 7.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true

# Refus par defaut : rien ne fonctionne sans identifiants declares.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ── Ecouteur local, en clair ────────────────────────────────────────────────
# Utilise par la passerelle, Node-RED et Grafana, qui tournent sur la meme
# machine. A ne pas publier vers l'exterieur.
listener 1883
protocol mqtt

# ── Ecouteur TLS ────────────────────────────────────────────────────────────
# Les certificats sont ceux obtenus par Caddy aupres de Let's Encrypt et
# partages en lecture seule (volume caddy_data). Le chemin depend du domaine :
# l'ajuster apres le premier demarrage de Caddy (voir README, section TLS).
#
# Interet concret pour AquaLook : la chaine Let's Encrypt remonte a ISRG Root
# X1, deja presente dans le magasin de confiance du firmware (OtaTlsTrust.h).
# Le module fera donc confiance au broker sans embarquer de certificat
# supplementaire ni gerer une autorite privee a renouveler.
listener 8883
protocol mqtt
cafile   /caddy-certs/caddy/pki/authorities/local/root.crt
certfile /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/CHANGEME_DOMAIN/CHANGEME_DOMAIN.crt
keyfile  /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/CHANGEME_DOMAIN/CHANGEME_DOMAIN.key
tls_version tlsv1.2

# Bornes de securite : un module qui deraille ne doit pas pouvoir saturer le
# broker. Valeurs volontairement conservatrices, a ajuster apres mesure.
max_inflight_messages 20
max_queued_messages 200
message_size_limit 65536
